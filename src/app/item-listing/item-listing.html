<section class="card listing">
    <img [src]="itemListing().photo" class="card-img-top listing-photo" alt="Photo of {{ itemListing().name }}">
    <span class="card-body">
        <h6 class="card-title">{{ itemListing().name }}</h6>
        <p class="card-text">{{ itemListing().description }}</p>
    </span>
</section>
