<div class="container mt-4">
  <div class="row align-items-start">
      <!-- Column 1-->
    <div class="col">
        <h3 class="project-title">{{project().name}}</h3>
        <span class="project-description p-1 m-1">{{project().description}}</span>

        <div class="container">
            <div class="row mt-2">
                <div class="col-sm-4 project-detail-label p-1">Date Completed:</div>
                <div class="col-sm-7 p-1">{{dateCompleted}}</div>
            </div>
            <div class="row mt-2">
                <div class="col-sm-4 project-detail-label p-1">Supplies Used:</div>
                <div class="col-sm-7 p-1">
                        @for (supplyItem of project().supplies; track $index) {
                            <span class="badge mb-2 me-2">{{supplyItem}}</span>
                        }
                </div>

            </div>
            <div class="row mt-2">
                <div class="col-sm-4 project-detail-label p-1">Tools Used:</div>
                <div class="col-sm-7 p-1">
                    @for (toolItem of project().tools; track $index) {
                        <span class="badge mb-2 me-2">{{toolItem}}</span>
                    }
                </div>
            </div>
        </div>
    </div>
    

    <!-- Column 2 -->
    <div class="col">
        <div id="carouselExample" class="carousel slide">
            <div class="carousel-inner">
                @for (image of project().photos; track $index) {
                    <div class="carousel-item project-photos" [ngClass]="{'active': $index === 0}">
                        <img [src]="image" class="d-block w-100" alt="image">
                    </div>
                }
            </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
        </button>
        </div>

    </div>

  </div>
</div>
